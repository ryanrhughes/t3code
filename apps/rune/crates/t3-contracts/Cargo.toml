[package]
name = "t3-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust types for T3 Code's WebSocket RPC contracts, generated at build time from schema/contracts.json."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regress = "0.10"

[build-dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
typify = "0.4"
schemars = "0.8"
prettyplease = "0.2"
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
